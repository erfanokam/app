  else if(a==="like"){await likeP(k)}
  else if(a==="oc"){S.oc=S.oc||{};S.oc[k]=!S.oc[k];render(true)}
  else if(a==="cm"){const p=S.posts.find(x=>x.id===k),inp=$("#c_"+k),tx=inp&&inp.value.trim();if(!p||!tx)return;inp.value="";await put("posts",k,{...strip(p),cm:[...(p.cm||[]),{n:S.acc.name,t:tx}]})}
  else if(a==="postPost"){const s=myShop(),tx=v("#stx").trim(),f=$("#sim").files[0],img=f?await imgData(f):"";if(!tx&&!img)return;
    const bg=+(document.querySelector('input[name=bg]:checked')||{value:0}).value;await put("posts","p"+id36(),{shop:s.id,name:s.name,city:s.city,text:tx,bg,img,likes:[],cm:[],ts:Date.now()});S.form="";S.page="home";toast(t("ok"));render(true);scrollTo(0,0)}
  else if(a==="pexit"){location.hash="";S.hash="";render(true)}
  else if(a==="block"){const u=S.accs.find(x=>x.id===k);if(u)await put("accounts",k,{...strip(u),blocked:!u.blocked})}
  else if(a==="delu"){if(S.cd!==k){S.cd=k;render(true);return}S.cd="";await del("accounts",k)}
  else if(a==="role"){const u=S.accs.find(x=>x.id===k);if(u)await put("accounts",k,{...strip(u),role:u.role==="admin"?"user":"admin"})}
});
(async()=>{
  S.lang=ls.get("nb_lang")||"fa";S.theme=ls.get("nb_theme")||"";if(S.theme)document.documentElement.dataset.theme=S.theme;
  render(true);
  tg(25);try{const c=window.claude;if(c){S.db=await c.use("db");tg(55);const u=await c.use("user");S.owner=u?await u.isOwner():false}}catch(e){S.db=null}
  tg(70);if(!S.db){const sid0=ls.get("nb_sid"),u0=S.accs.find(x=>x.id===sid0);if(u0&&!u0.blocked)S.acc={...u0}}
  if(S.db){sub("shops","shops");sub("stories","stories");sub("posts","posts");try{S.db.doc("config/home").onSnapshot(d=>{S.cfg=d.data()||{};render()},()=>{})}catch(e){}
    const sid=ls.get("nb_sid");if(sid){try{const s=await S.db.doc("accounts/"+sid).get();if(s.exists&&!s.data().blocked)S.acc={id:sid,...s.data()}}catch(e){}}
    subAcc()}
  render(true);tg(100)})();
